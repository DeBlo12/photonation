# cargo-about configuration: the THIRD-PARTY-LICENSES file shipped with every
# binary distribution (see NOTICE, "Obligations when distributing binaries").
# Generated by the build-installer scripts in packaging/macos and
# packaging/windows; run locally with
#   cargo about generate --locked --workspace -o target/THIRD-PARTY-LICENSES.txt packaging/third-party-licenses.hbs
# Keep `accepted` in step with [licenses] allow in deny.toml.

accepted = [
    "LGPL-2.1",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "IJG",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
