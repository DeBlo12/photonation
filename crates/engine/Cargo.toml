[package]
name = "photonation-engine"
description = "Photonation session services: background rendering, thumbnails, export jobs, history"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
photonation-color.workspace = true
photonation-image.workspace = true
photonation-develop.workspace = true
photonation-raw.workspace = true
photonation-pipeline.workspace = true
photonation-export.workspace = true
photonation-retouch.workspace = true
photonation-gpu = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[features]
# The "Generative AI" removal method: neural inpainting with an ONNX model.
ai = ["photonation-retouch/onnx"]
# Previews on the GPU (wgpu compute), falling back to the CPU.
gpu = ["dep:photonation-gpu"]

[dev-dependencies]
photonation-image = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[lints]
workspace = true
