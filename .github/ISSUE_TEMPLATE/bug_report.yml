name: Bug report
description: Something renders wrong, crashes or misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Move the … slider
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: Camera and file format
      placeholder: Canon EOS 250D, CR3
  - type: textarea
    id: info
    attributes:
      label: "`photonation info <file>` output"
      render: text
  - type: input
    id: version
    attributes:
      label: Photonation commit or version
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1 (Apple M1 Pro)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or sample files
      description: Only attach raw files you are happy to make public.
