name: Feature request
description: Suggest a tool, control or workflow
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? References to Lightroom, Photomator or others are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
