[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
repository = "https://github.com/DeBlo12/photonation"
homepage = "https://github.com/DeBlo12/photonation"
authors = ["The Photonation contributors"]
# Not on crates.io yet; flip when the crate APIs stabilize.
publish = false

[workspace.dependencies]
# internal
photonation-color = { path = "crates/color" }
photonation-image = { path = "crates/image" }
photonation-develop = { path = "crates/develop" }
photonation-raw = { path = "crates/raw" }
photonation-pipeline = { path = "crates/pipeline" }
photonation-export = { path = "crates/export" }
photonation-engine = { path = "crates/engine" }
photonation-retouch = { path = "crates/retouch" }
photonation-gpu = { path = "crates/gpu" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
# Exclusive, randomly named temporary files for atomic writes.
tempfile = "3.27"

# Lightroom XMP sidecars (read-only XML tree)
roxmltree = "0.21"

# raw decoding (LGPL-2.1, GPL-3.0 compatible; see NOTICE)
rawler = "0.8.0"

# codecs and colour management
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
png = "0.18"
tiff = "0.11"
moxcms = { version = "0.9", default-features = false }

# neural inpainting: pure-Rust ONNX runtime (MIT OR Apache-2.0)
tract-onnx = "0.23.9"

# GPU rendering (the same wgpu eframe draws with)
wgpu = { version = "30.0", default-features = false, features = ["std", "wgsl", "dx12", "metal", "vulkan"] }
# Blocks on wgpu's adapter, device and error-scope futures.
pollster = "1.0"

# desktop app
eframe = "0.37"
rfd = "0.17"
# Moving rejected photos to the Recycle Bin / Trash (MIT)
trash = "5.2"
# SVG path data of the brand icons (already in the tree through egui)
kurbo = "0.13"
# Icon and version info in the Windows executable (build script)
winresource = "0.1.34"
# Shader validation in tests; the same naga wgpu compiles shaders with.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Image processing is unusable at opt-level 0; keep dependencies and the
# per-pixel crates optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.photonation-pipeline]
opt-level = 3

[profile.dev.package.photonation-color]
opt-level = 3

[profile.dev.package.photonation-gpu]
opt-level = 3
