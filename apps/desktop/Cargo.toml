[package]
name = "photonation-desktop"
description = "Photonation desktop editor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "photonation-desktop"
path = "src/main.rs"

[dependencies]
photonation-color.workspace = true
photonation-image.workspace = true
photonation-develop.workspace = true
photonation-pipeline.workspace = true
photonation-export.workspace = true
photonation-engine.workspace = true
eframe.workspace = true
kurbo.workspace = true
rfd.workspace = true
trash.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
default = ["ai", "gpu"]
# The "Generative AI" removal method (neural inpainting, tract). Without it
# generative removals use content-aware fill.
ai = ["photonation-engine/ai"]
# Previews rendered on the GPU (wgpu compute) where possible.
gpu = ["photonation-engine/gpu"]

[dev-dependencies]
naga.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
